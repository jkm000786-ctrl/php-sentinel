[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "php-sentinel"
dynamic = ["version"]
description = "Evidence-driven PHP vulnerability exposure assessment"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Jahangir Karim"},
]
keywords = [
  "application-security",
  "php",
  "vulnerability-assessment",
  "security-intelligence",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "rich>=13.9,<15",
  "packaging>=24.2,<26",
  "cryptography>=44,<50",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
php-sentinel = "php_sentinel.cli:app"
php-sentinel-matrix = "php_sentinel.matrix_cli:cli"
php-sentinel-cve = "php_sentinel.cve_cli:cli"
php-sentinel-compare = "php_sentinel.compare_cli:cli"
php-sentinel-intel = "php_sentinel.intelligence_cli:cli"
php-sentinel-update = "php_sentinel.intelligence_update_cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "php_sentinel.__version__"}

[tool.setuptools.package-data]
php_sentinel = ["data/intelligence/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
