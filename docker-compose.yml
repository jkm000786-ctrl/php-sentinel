services:
  scanner:
    build:
      context: .
      dockerfile: docker/scanner/Dockerfile
    working_dir: /app
    volumes:
      - ./output:/app/output
    entrypoint: ["php-sentinel"]

  patched-php:
    image: php:8.5.12-apache
    networks:
      - php-sentinel-lab
    profiles: ["lab"]
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./lab/patched/index.php:/var/www/html/index.php:ro


  vendor-backport-sim:
    image: php:8.5.12-apache
    networks:
      - php-sentinel-lab
    profiles: ["lab"]
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./lab/simulated-vendor-backport/index.php:/var/www/html/index.php:ro


networks:
  php-sentinel-lab:
    driver: bridge
